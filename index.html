<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prank Test</title>
  <style>
    body { 
      background:#0b1020; 
      color:white; 
      font-family:sans-serif; 
      text-align:center; 
      padding:50px; 
    }
    #bar {
      width:0%; 
      height:20px; 
      background:gold; 
      transition:width 0.5s linear;
    }
    #progress {
      width:80%; 
      margin:20px auto; 
      background:#333; 
      border-radius:10px; 
      overflow:hidden;
    }
    #prank {
      display:none; 
      font-size:40px; 
      margin-top:50px;
    }
  </style>
</head>
<body>
  <h1>Verifying product availability...</h1>
  <div id="progress"><div id="bar"></div></div>
  <div id="prank">😈 GOTCHA!</div>

  <script>
    const bar = document.getElementById('bar');
    const prank = document.getElementById('prank');

    let pct = 0;
    const interval = setInterval(()=>{
      pct += 20;
      bar.style.width = pct + '%';
      if(pct >= 100){
        clearInterval(interval);
        document.querySelector('h1').style.display = 'none';
        document.getElementById('progress').style.display = 'none';
        prank.style.display = 'block';
      }
    }, 800);
  </script>
</body>
</html>
